# Render Web Service – Lifez.AI
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lifez-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false  # set in Render dashboard
