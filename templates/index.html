<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifez.AI - Smart Product Recommendations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.9) 100%);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
      padding: 1.5rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      height: calc(100vh - 120px);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.8) 100%);
      border: 1px solid rgba(226, 232, 240, 0.5);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .panel-header {
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.08) 0%, rgba(167, 139, 250, 0.08) 100%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
    }

    .panel-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1e293b;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #ffffff;
    }

    .message {
      padding: 0.95rem 1.2rem;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
    }

    .message.assistant {
      background: #f1f5f9;
      color: #475569;
      align-self: flex-start;
      border: 1px solid rgba(226, 232, 240, 0.5);
      border-bottom-left-radius: 4px;
    }

    .input-area {
      padding: 1.5rem;
      background: #f8fafc;
      border-top: 1px solid rgba(226, 232, 240, 0.5);
      display: flex;
      gap: 0.75rem;
    }

    .input-area input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.7);
      border-radius: 10px;
      color: #1e293b;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .input-area input:focus {
      outline: none;
      background: #ffffff;
      border-color: rgba(96, 165, 250, 0.7);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
    }

    .input-area input::placeholder {
      color: #94a3b8;
    }

    .input-area button {
      padding: 0.85rem 1.8rem;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .input-area button:active {
      transform: translateY(0);
    }

    .products-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.85) 100%);
      border: 1px solid rgba(226, 232, 240, 0.5);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(96, 165, 250, 0.1);
    }

    .product-image {
      height: 180px;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .product-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    .product-description {
      color: #64748b;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .stars {
      color: #fbbf24;
      font-size: 1rem;
    }

    .rating-value {
      color: #475569;
    }

    .product-specs {
      background: rgba(96, 165, 250, 0.05);
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      flex: 1;
    }

    .spec-item {
      font-size: 0.85rem;
      color: #475569;
      margin: 0.35rem 0;
    }

    .spec-item:before {
      content: "✓ ";
      color: #60a5fa;
      font-weight: bold;
    }

    .product-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      color: white;
    }

    .btn-primary:hover {
      box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(96, 165, 250, 0.1);
      border-color: rgba(96, 165, 250, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }

    .empty-state p {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #475569;
    }

    .spinner {
      border: 3px solid rgba(96, 165, 250, 0.1);
      border-top: 3px solid #60a5fa;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .reasoning-box {
      background: rgba(96, 165, 250, 0.08);
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border-left: 4px solid #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-left: 4px solid #60a5fa;
    }

    .reasoning-box h3 {
      color: #2563eb;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .reasoning-box p {
      color: #475569;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(226, 232, 240, 0.3);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(96, 165, 250, 0.4);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(96, 165, 250, 0.6);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #1e293b;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      background: #f1f5f9;
      border-radius: 8px;
    }

    .detail-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .detail-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .detail-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .detail-category {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #60a5fa;
      margin-bottom: 1rem;
    }

    .detail-price {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .detail-section {
      margin-bottom: 1.5rem;
    }

    .detail-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.75rem;
    }

    .detail-description {
      color: #475569;
      line-height: 1.7;
      font-size: 1rem;
    }

    .detail-specs {
      background: #f8fafc;
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .detail-spec-item {
      padding: 0.5rem 0;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .detail-spec-item:before {
      content: "✓";
      color: #60a5fa;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .detail-rating {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .detail-rating .stars {
      color: #fbbf24;
    }

    .detail-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
    }

    .detail-actions button {
      flex: 1;
      padding: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .detail-actions .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      color: white;
    }

    .detail-actions .btn-primary:hover {
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      transform: translateY(-2px);
    }

    .detail-actions .btn-secondary {
      background: #f1f5f9;
      color: #60a5fa;
      border: 1px solid #e2e8f0;
    }

    .detail-actions .btn-secondary:hover {
      background: #e2e8f0;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
        height: auto;
      }

      .chat-panel {
        height: 500px;
      }

      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 0 1rem;
      }

      .container {
        padding: 1.5rem 1rem;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div>
        <div class="logo">⚡ Lifez.AI</div>
        <div class="tagline">Smart Product Recommendations</div>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="main-grid">
      <div class="chat-panel">
        <div class="panel-header">
          <h2>💬 What Are You Looking For?</h2>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-area">
          <input 
            type="text" 
            id="requirementInput" 
            placeholder="Describe what you need..." 
            onkeypress="handleKeyPress(event)"
          >
          <button onclick="sendRequirement()">Send</button>
        </div>
      </div>

      <div class="products-panel">
        <h1 class="section-title">📦 Recommendations</h1>
        <div id="recommendationsContainer" class="empty-state">
          <p>Tell us what you need and we'll find the perfect products for you 🎯</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Details Modal -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
      <div id="detailContent">
        <!-- Details will be loaded here -->
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const recommendationsContainer = document.getElementById('recommendationsContainer');
    const requirementInput = document.getElementById('requirementInput');

    function addMessage(text, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
      messageDiv.textContent = text;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendRequirement();
      }
    }

    async function sendRequirement() {
      const requirement = requirementInput.value.trim();
      
      if (!requirement) {
        alert('Please describe what you need');
        return;
      }

      addMessage(requirement, true);
      requirementInput.value = '';
      requirementInput.focus();

      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'loading';
      loadingDiv.className = 'loading';
      loadingDiv.innerHTML = '<div class="spinner"></div>Finding perfect matches...';
      recommendationsContainer.innerHTML = '';
      recommendationsContainer.appendChild(loadingDiv);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
        
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ requirement }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        console.log('API Response:', data);

        if (data.success && data.recommended_products && data.recommended_products.length > 0) {
          addMessage(`Found ${data.count} great options for you! ✨`);
          displayRecommendations(data);
        } else if (data.error) {
          addMessage(`Hmm, couldn't find recommendations. ${data.error}`);
          recommendationsContainer.innerHTML = '<div class="empty-state"><p>Error: ' + data.error + '</p></div>';
        } else {
          addMessage('No products matched your search. Try a different query.');
          recommendationsContainer.innerHTML = '<div class="empty-state"><p>No matches found</p></div>';
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          addMessage('Request timed out. The server took too long to respond. Please try again.');
        } else {
          addMessage('Connection error. Please try again.');
        }
        console.error('Fetch Error:', error);
        recommendationsContainer.innerHTML = `<div class="empty-state"><p>Error: ${error.message}</p></div>`;
      }
    }

    function displayRecommendations(data) {
      recommendationsContainer.innerHTML = '';

      if (data.reasoning) {
        const reasoningBox = document.createElement('div');
        reasoningBox.className = 'reasoning-box';
        reasoningBox.innerHTML = `
          <h3>Why these? 🤔</h3>
          <p>${data.reasoning}</p>
        `;
        recommendationsContainer.appendChild(reasoningBox);
      }

      if (data.recommended_products && data.recommended_products.length > 0) {
        const grid = document.createElement('div');
        grid.className = 'products-grid';

        data.recommended_products.forEach(product => {
          const card = createProductCard(product);
          grid.appendChild(card);
        });

        recommendationsContainer.appendChild(grid);
      } else {
        recommendationsContainer.innerHTML = '<div class="empty-state"><p>No products match your needs</p></div>';
      }
    }

    function createProductCard(product) {
      const card = document.createElement('div');
      card.className = 'product-card';

      const stars = '⭐'.repeat(Math.floor(product.rating)) + 
                    (product.rating % 1 >= 0.5 ? '✨' : '');

      const categoryEmoji = {
        'electronics': '💻',
        'audio': '🎧',
        'mobile': '📱',
        'peripherals': '⌨️',
        'wearables': '⌚'
      }[product.category] || '📦';

      card.innerHTML = `
        <div class="product-image">${categoryEmoji}</div>
        <div class="product-content">
          <div class="product-category">${product.category}</div>
          <div class="product-name">${product.name}</div>
          <div class="product-price">$${product.price}</div>
          <p class="product-description">${product.description}</p>
          <div class="product-rating">
            <span class="stars">${stars}</span>
            <span class="rating-value">${product.rating}/5</span>
          </div>
          <div class="product-specs">
            ${product.specs.map(spec => `<div class="spec-item">${spec}</div>`).join('')}
          </div>
          <div class="product-actions">
            <button class="btn btn-primary" onclick="viewDetails(${product.id})">View</button>
            <button class="btn btn-secondary" onclick="addToCart(${product.id})">Add Cart</button>
          </div>
        </div>
      `;

      return card;
    }

    function viewDetails(productId) {
      const allProducts = Array.from(document.querySelectorAll('.product-card')).map((card, index) => {
        const name = card.querySelector('.product-name')?.textContent || '';
        const price = card.querySelector('.product-price')?.textContent?.replace('$', '') || '';
        const category = card.querySelector('.product-category')?.textContent || '';
        const description = card.querySelector('.product-description')?.textContent || '';
        const rating = card.querySelector('.rating-value')?.textContent?.split('/')[0] || '0';
        const specs = Array.from(card.querySelectorAll('.spec-item')).map(s => s.textContent.trim());
        const categoryEmoji = {
          'electronics': '💻',
          'audio': '🎧',
          'mobile': '📱',
          'peripherals': '⌨️',
          'wearables': '⌚'
        }[category];
        
        return { id: productId, name, price, category, description, rating, specs, emoji: categoryEmoji };
      });

      const product = allProducts[0];
      if (!product) return;

      const stars = '⭐'.repeat(Math.floor(product.rating)) + 
                    (product.rating % 1 >= 0.5 ? '✨' : '');

      const modal = document.getElementById('detailModal');
      const detailContent = document.getElementById('detailContent');
      
      detailContent.innerHTML = `
        <div class="detail-header">
          <div class="detail-emoji">${product.emoji || '📦'}</div>
          <div class="detail-category">${product.category}</div>
          <div class="detail-title">${product.name}</div>
          <div class="detail-price">\$${product.price}</div>
        </div>

        <div class="detail-rating">
          <span class="stars">${stars}</span>
          <span>${product.rating}/5</span>
        </div>

        <div class="detail-section">
          <h3>Description</h3>
          <p class="detail-description">${product.description}</p>
        </div>

        <div class="detail-section">
          <h3>Key Features</h3>
          <div class="detail-specs">
            ${product.specs.map(spec => `<div class="detail-spec-item">${spec}</div>`).join('')}
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn-secondary" onclick="closeDetailModal()">Close</button>
          <button class="btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
        </div>
      `;
      
      modal.classList.add('active');
    }

    function closeDetailModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.remove('active');
    }

    // Close modal when clicking outside of it
    const detailModal = document.getElementById('detailModal');
    if (detailModal) {
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) {
          closeDetailModal();
        }
      });
    }

    function addToCart(productId) {
      addMessage(`Added product #${productId} to cart! 🎉`);
    }
  </script>
</body>
